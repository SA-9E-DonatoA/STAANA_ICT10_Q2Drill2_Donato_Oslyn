<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Roster</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fredoka Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --rose: #D8A2A2;
            --pink: #FFDCDC;
            --cream: #FFF9D6;
            --sage: #8EA66B;
            --ink: #443838;
            --muted: #796969;
        }

        body {
            margin: 0;
            background-color: var(--cream);
            color: var(--ink);
            font-family: 'Fredoka', sans-serif;
        }

        /* Main heading */
        .hero {
            background-color: var(--cream);
            color: var(--rose);
            padding: 30px 24px;
            border-bottom: 6px solid var(--sage);
        }

        .hero h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--rose);
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .page-wrap {
            max-width: 1050px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* White cards */
        .panel {
            background-color: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 5px 18px rgba(100, 70, 70, 0.08);
        }

        .panel h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--rose);
            margin-bottom: 18px;
        }

        /* Form */
        .form-label {
            font-weight: 500;
        }

        .form-control {
            border: 1px solid var(--rose);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Fredoka', sans-serif;
        }

        .form-control:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(142, 166, 107, 0.2);
        }

        /* Button */
        .btn-roster {
            width: 100%;
            background-color: var(--rose);
            color: var(--ink);
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-roster:hover {
            background-color: var(--sage);
            color: white;
        }

        /* Summary */
        .summary {
            background-color: var(--pink);
            border-radius: 10px;
            padding: 18px 20px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .summary-label {
            color: var(--muted);
            margin-bottom: 5px;
        }

        .total-number {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--ink);
        }

        .grade-counts {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
        }

        /* Roster list */
        .roster-box {
            background-color: #FFF9F9;
            border: 1px solid var(--pink);
            border-radius: 10px;
            padding: 16px 20px;
        }

        .member-list {
            columns: 2;
            column-gap: 36px;
            margin: 0;
            padding-left: 26px;
        }

        .member-list li {
            padding: 5px 0 6px 6px;
            break-inside: avoid;
        }

        .grade-tag {
            color: var(--muted);
            font-size: 0.94em;
        }

        .notice {
            color: #805050;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2rem;
            }

            .panel {
                padding: 19px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .member-list {
                columns: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="hero">
        <h1>Student Club Roster</h1>
        <p>Add a member and see the combined list of all grade levels.</p>
    </header>

    <main class="page-wrap">

        <!-- Add Member Form -->
        <section class="panel">
            <h2>Add new club member</h2>

            <form id="memberForm">
                <div class="mb-3">
                    <label for="firstName" class="form-label">
                        First name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        class="form-control"
                        placeholder="Enter first name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        class="form-control"
                        placeholder="Enter last name"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-roster">
                    Add member
                </button>

                <p id="notice" class="notice" role="status"></p>
            </form>
        </section>

        <!-- Club Roster -->
        <section class="panel">
            <h2>Club Roster</h2>

            <p class="text-secondary">
                Full list of members and total number of members.
            </p>

            <div class="summary">
                <div>
                    <div class="summary-label">Total members</div>
                    <div class="total-number" id="totalMembers">0</div>
                </div>

                <div>
                    <div class="summary-label">Grade level counts</div>
                    <div class="grade-counts" id="gradeCounts"></div>
                </div>
            </div>

            <div class="roster-box" id="rosterOutput"></div>
        </section>

    </main>

    <script>
        // Grade 7 members
        const grade7 = new Set([
            "Liam Anderson",
            "Emma Thompson",
            "Noah Bennett",
            "Mia Collins",
            "Lucas Mitchell"
        ]);

        // Grade 8 members
        const grade8 = new Set([
            "Olivia Parker",
            "Ethan Brooks",
            "Ava Morgan",
            "James Cooper",
            "Isabella Reed"
        ]);

        // Grade 9 members
        const grade9 = new Set([
            "Mason Bailey",
            "Amelia Foster",
            "Logan Hughes",
            "Harper Kelly",
            "Elijah Ward"
        ]);

        // Grade 10 members
        const grade10 = new Set([
            "Charlotte Price",
            "Benjamin Ross",
            "Evelyn James",
            "Henry Scott",
            "Abigail Turner"
        ]);

        // Display the combined roster and counts.
        function display() {
            // Combine all four sets into one master set.
            const allMembers = new Set([
                ...grade7,
                ...grade8,
                ...grade9,
                ...grade10
            ]);

            // Store the member counts for each grade.
            const counts = new Map([
                ["Grade 7", grade7.size],
                ["Grade 8", grade8.size],
                ["Grade 9", grade9.size],
                ["Grade 10", grade10.size]
            ]);

            // Display the total number of members.
            document.getElementById("totalMembers").textContent =
                allMembers.size;

            // Display each grade's count.
            document.getElementById("gradeCounts").innerHTML =
                [...counts].map(([grade, count]) =>
                    `<span>${grade}: ${count}</span>`
                ).join("<span>|</span>");

            // Assign each name to its grade.
            const memberItems = [...allMembers].map((name) => {
                const grade = grade7.has(name) ? "Grade 7"
                    : grade8.has(name) ? "Grade 8"
                    : grade9.has(name) ? "Grade 9"
                    : "Grade 10";

                return `<li>${name} <span class="grade-tag">(${grade})</span></li>`;
            }).join("");

            // Display the complete member list.
            document.getElementById("rosterOutput").innerHTML =
                `<ol class="member-list">${memberItems}</ol>`;
        }

        // Handle the Add Member button.
        document.getElementById("memberForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const firstName =
                    document.getElementById("firstName").value.trim();

                const lastName =
                    document.getElementById("lastName").value.trim();

                const fullName = `${firstName} ${lastName}`;
                const notice = document.getElementById("notice");

                // Create a combined set to check for duplicates.
                const allMembers = new Set([
                    ...grade7,
                    ...grade8,
                    ...grade9,
                    ...grade10
                ]);

                if (!firstName || !lastName) {
                    notice.textContent =
                        "Please enter both a first name and a last name.";
                } else if (allMembers.has(fullName)) {
                    notice.textContent =
                        "That member is already on the roster.";
                } else {
                    // Add the new member to Grade 10.
                    grade10.add(fullName);

                    notice.textContent =
                        `${fullName} was added to Grade 10.`;

                    document.getElementById("memberForm").reset();

                    // Refresh the roster and member counts.
                    display();
                }
            }
        );

        // Display the roster when the page first loads.
        display();
    </script>

</body>
</html>
